<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donation History</title>

  <!-- Bootstrap CSS for layout and styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Your custom blue theme CSS -->
  <style>
    body {
      background-color: #e6f0ff;
      font-family: Arial, sans-serif;
      color: #003366;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
      box-shadow: 0 4px 15px rgba(0, 51, 102, 0.2);
    }

    h2 {
      color: #004080;
      text-align: center; /* Center the heading */
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    table.table thead {
      background-color: #cce5ff;
    }

    table.table tbody tr:hover {
      background-color: #f0f8ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Donation History</h2>

    <!-- Buttons for export options -->
    <div class="mb-4 text-center">
      <button id="export-pdf" class="btn btn-primary">Export as PDF</button>
      <button id="export-excel" class="btn btn-primary">Export as Excel</button>
    </div>

    <!-- Table to display donation history -->
    <table id="donation-history" class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Donor Name</th>
          <th>Donation Type</th>
          <th>Quantity</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <!-- Example row, replace with dynamic data -->
        <tr>
          <td>1</td>
          <td>Muskan</td>
          <td>Food</td>
          <td>5 Kgs</td>
          <td>2025-04-17</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Pragya</td>
          <td>Packaged Food</td>
          <td>10 Packs</td>
          <td>2025-04-18</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- External JS libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- JavaScript to handle export functionality -->
  <script>
    // Export as Excel
    document.getElementById("export-excel").addEventListener("click", function() {
      const table = document.getElementById("donation-history");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Donation History" });
      XLSX.writeFile(wb, "donation_history.xlsx");
    });

    // Export as PDF
    document.getElementById("export-pdf").addEventListener("click", function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.autoTable({ html: '#donation-history' });
      doc.save('donation_history.pdf');
    });
  </script>
</body>
</html>
